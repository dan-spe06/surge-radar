name: Surge Radar scan
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
concurrency: { group: scan, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node ci.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save history
        run: |
          git config user.name surge-radar-bot
          git config user.email bot@users.noreply.github.com
          git add data
          git diff --cached --quiet || (git commit -m "scan $(date -u +%FT%TZ)" && git pull --rebase && git push)
