<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Surge Radar</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700&f[]=jetbrains-mono@500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--panel:#151b23;--line:#242d38;--text:#e6edf3;--mute:#8b98a8;--amber:#f5b84b;--long:#3fb68b;--short:#ef6461;--r:14px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 Satoshi,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(80px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 16px 10px}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:30px;height:30px}
.brand h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.brand .meta{margin-left:auto;text-align:right;font-size:12px;color:var(--mute)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--long);margin-right:5px;animation:p 2s infinite}
@keyframes p{50%{opacity:.3}}
.tabs{display:flex;gap:6px;margin-top:12px}
.tabs button{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:8px 0;border-radius:10px;font:inherit;font-size:13px;font-weight:700}
.tabs button.on{color:var(--bg);background:var(--amber);border-color:var(--amber)}
main{padding:14px 16px;display:grid;gap:10px;max-width:720px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer}
.card.alert{border-color:rgba(245,184,75,.55);box-shadow:0 0 0 1px rgba(245,184,75,.15) inset}
.row{display:flex;align-items:center;gap:10px}
.sym{font-weight:700;font-size:16px}
.nm{color:var(--mute);font-size:12px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em}
.tag.LONG{background:rgba(63,182,139,.15);color:var(--long)}.tag.SHORT{background:rgba(239,100,97,.15);color:var(--short)}
.tag.ALERT{background:var(--amber);color:#1a1205}.tag.WATCH{background:#2a3441;color:var(--text)}.tag.QUIET{background:transparent;color:var(--mute);border:1px solid var(--line)}
.score{margin-left:auto;text-align:right}
.score b{font-size:20px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--amber)}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.plan div{background:#0f141b;border:1px solid var(--line);border-radius:10px;padding:8px}
.plan span{display:block;font-size:11px;color:var(--mute)}
.plan b{font-size:14px}
.plan .sl b{color:var(--short)}.plan .tp b{color:var(--long)}
ul.f{margin:10px 0 0;padding-left:18px;font-size:13px;color:#c5cfdb}
ul.f.blk{color:var(--short)}
.detail{display:none}.card.open .detail{display:block}
.note{font-size:12px;color:var(--mute);margin-top:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h2{font-size:14px;margin-bottom:8px}
label{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
input{background:#0f141b;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;width:96px;text-align:right;font:inherit}
.btn{background:var(--amber);color:#1a1205;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:700;width:100%;margin-top:10px}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.empty{text-align:center;color:var(--mute);padding:36px 12px}
.skel{height:88px;border-radius:var(--r);background:linear-gradient(90deg,#151b23,#1b232d,#151b23);background-size:200% 100%;animation:s 1.2s infinite}
@keyframes s{to{background-position:-200% 0}}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(13,17,23,.96);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:12px;font-weight:700;padding:6px}
nav button.on{color:var(--amber)}
.news div{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)}
.disc{font-size:11px;color:var(--mute);text-align:center;padding:8px 0}
#hf button{font-size:12px;padding:8px 4px;min-width:30%}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 512 512" aria-label="Surge Radar logo"><rect width="512" height="512" rx="112" fill="#151b23"/><circle cx="256" cy="256" r="150" fill="none" stroke="#2a3441" stroke-width="18"/><path d="M96 300 L190 300 L226 196 L280 356 L316 250 L416 250" fill="none" stroke="#f5b84b" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Surge Radar</h1>
    <div class="meta"><div><span class="pulse"></span><span id="last">Scanning…</span></div><div class="mono" id="next"></div></div>
  </div>
  <div class="tabs" id="tabs"><button data-f="ALERT" class="on">Signals</button><button data-f="WATCH">Building</button><button data-f="ALL">All 47</button></div>
</header>
<main id="view"></main>
<nav><button data-v="scan" class="on">Scanner</button><button data-v="history">History</button><button data-v="news">News</button><button data-v="settings">Settings</button></nav>
<script>
const PORT_RAW = '__PORT_8000__';
const BASE = PORT_RAW.indexOf('PORT_') === 2 ? '' : PORT_RAW; // pplx preview rewrites the placeholder; Vercel serves /api on the same origin
const API = BASE + '/api/scan';
const PUBLIC_URL = 'https://surge-radar-theta.vercel.app'; // public link used for "Copy report link"
const ck = document.cookie.match(/sr=([^;]+)/);
const S = Object.assign({account:500,risk:1.5,rr:2.5,notify:false}, ck ? JSON.parse(decodeURIComponent(ck[1])) : {}); const seenMem = {};
const saveS = () => { document.cookie = 'sr=' + encodeURIComponent(JSON.stringify(S)) + ';max-age=31536000;path=/;SameSite=Lax'; };
let hist = null, summ = null;
const HRAW = 'https://raw.githubusercontent.com/dan-spe06/surge-radar/data/data'; // live alert log written by the 10-minute scanner
let scan = null, filter = 'ALERT', view = 'scan', nextAt = 0;
const $ = s => document.querySelector(s);
const fmt = x => { if (x == null || !isFinite(x)) return '—'; const a = Math.abs(x); const d = a >= 1000 ? 2 : a >= 10 ? 3 : a >= 1 ? 4 : a >= .01 ? 5 : 8; return x.toLocaleString('en-US', { minimumFractionDigits: Math.min(d, 2), maximumFractionDigits: d }); };
const t = ts => new Date(ts).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

function adjust(r) { // re-derive levels/size from the user's settings
  if (!r.plan) return null;
  const p = { ...r.plan }, base = scan.config;
  const tpDist = p.stopDist * S.rr; p.takeProfit = r.dir === 'LONG' ? p.entry + tpDist : p.entry - tpDist;
  const k = (S.account * S.risk / 100) / p.risk$; p.risk$ = S.account * S.risk / 100;
  p.qty = p.unit === 'lots' ? Math.floor(p.qty * k * 100) / 100 : p.qty * k;
  if (/^M/.test(p.unit) && r.cls === 'futures') { const per = p.risk$ / k; }
  return p;
}
function card(r) {
  const p = adjust(r);
  return `<article class="card ${r.status === 'ALERT' ? 'alert' : ''}" onclick="this.classList.toggle('open')">
    <div class="row"><div><div class="sym">${r.id} ${r.dir ? `<span class="tag ${r.dir}">${r.dir}</span>` : ''}</div><div class="nm">${r.name} · <span class="mono">${fmt(r.price)}</span></div></div>
    <div class="score"><span class="tag ${r.status}">${r.status === 'ALERT' ? 'TRADE' : r.status}</span><div><b class="mono">${r.score}</b><span class="nm">/100</span></div></div></div>
    <div class="bar"><i style="width:${r.score}%"></i></div>
    ${p && r.status === 'ALERT' ? planHTML(p) : ''}
    <div class="detail">${p && r.status !== 'ALERT' ? planHTML(p) : ''}
      ${r.factors.length ? `<ul class="f">${r.factors.map(f => `<li>${f}</li>`).join('')}</ul>` : '<p class="note">No surge conditions present.</p>'}
      ${r.blocks.length ? `<ul class="f blk">${r.blocks.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
      <p class="note mono">ATR(1h) ${fmt(r.stats.atr1h)} · RSI ${r.stats.rsi.toFixed(0)} · Vol ${r.stats.rvol.toFixed(1)}x${r.stats.funding != null ? ` · Funding ${(r.stats.funding * 100).toFixed(3)}%` : ''}${r.stats.oiChg6h ? ` · OI ${(r.stats.oiChg6h * 100).toFixed(1)}%` : ''}</p>
    </div></article>`;
}
function planHTML(p) {
  return `<div class="plan"><div><span>Entry</span><b class="mono">${fmt(p.entry)}</b></div><div class="sl"><span>Hard stop</span><b class="mono">${fmt(p.stop)}</b></div><div class="tp"><span>Take-profit</span><b class="mono">${fmt(p.takeProfit)}</b></div></div>
  <p class="note">Size <b class="mono">${fmt(p.qty)} ${p.unit}</b> · risk $${p.risk$.toFixed(2)} → reward $${(p.risk$ * S.rr).toFixed(2)} · ${p.note} · close by ${t(p.timeStop)} if neither hits. Place as one bracket/OCO order.</p>`;
}
function render() {
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.v === view));
  $('#tabs').style.display = view === 'scan' ? 'flex' : 'none';
  const v = $('#view');
  if (view === 'settings') {
    v.innerHTML = `<section class="panel"><h2>Account & risk</h2>
      <label>Account size ($)<input id="sa" type="number" value="${S.account}"></label>
      <label>Risk per trade (%)<input id="sr" type="number" step="0.1" value="${S.risk}"></label>
      <label>Reward : risk<input id="srr" type="number" step="0.1" value="${S.rr}"></label>
      <button class="btn" id="save">Save</button></section>
      <section class="panel"><h2>Phone alerts</h2><p class="note">Install the free <b>ntfy</b> app (App Store / Google Play), tap +, and subscribe to your private topic below. The always-on scanner pushes every new signal there within its 10-minute cycle, even when this app is closed.</p><p class="mono" style="margin-top:8px;font-size:13px;color:var(--amber)">Your private topic is in your Perplexity chat with Surge Radar.</p>
      <button class="btn ghost" id="np">${S.notify && Notification.permission === 'granted' ? 'In-app alerts on ✓' : 'Enable in-app alerts'}</button></section>
      <section class="panel"><h2>Install on your phone</h2><p class="note"><b>iPhone:</b> open in Safari → Share → Add to Home Screen.<br><b>Android:</b> Chrome menu ⋮ → Install app.</p></section>
      <p class="disc">Rules-based signals, not financial advice. Stops will be hit; the edge comes from 2.5:1 winners outweighing losses.</p>`;
    $('#save').onclick = () => { S.account = +$('#sa').value; S.risk = +$('#sr').value; S.rr = +$('#srr').value; saveS(); view = 'scan'; render(); };
    $('#np').onclick = async () => { if (!('Notification' in window)) return alert('Install the app to your home screen first.'); const p = await Notification.requestPermission(); S.notify = p === 'granted'; saveS(); render(); };
    return;
  }
  if (view === 'history') { renderHistory(v); return; }
  if (!scan) { v.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>'; return; }
  if (view === 'news') {
    v.innerHTML = `<section class="panel news"><h2>High-impact events this week</h2>${scan.news.length ? scan.news.map(e => `<div><span>${e.ccy} · ${e.title}</span><span class="mono">${new Date(e.time).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit' })}</span></div>`).join('') : '<p class="note">No high-impact events ahead.</p>'}</section><p class="disc">Signals are blocked in the 30 minutes before these releases.</p>`;
    return;
  }
  const list = scan.results.filter(r => filter === 'ALL' || r.status === filter);
  v.innerHTML = list.length ? list.map(card).join('') : `<div class="empty"><b>${filter === 'ALERT' ? 'No trade signals right now' : 'Nothing building yet'}</b><p class="note">${filter === 'ALERT' ? 'Signals need a score of 50+ and no blockers. Expect roughly 10–20 a day across all 47 markets.' : 'Markets scoring 40–49 show here.'}</p></div>`;
  v.innerHTML += `<p class="disc">${scan.results.length} markets · tap a card for details · not financial advice</p>`;
}
async function loadHistory() {
  try { const [h, sm] = await Promise.all([fetch(HRAW + '/history.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json()), fetch(HRAW + '/summary.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json())]); hist = Array.isArray(h) ? h : []; summ = sm; }
  catch { hist = hist || []; summ = summ || {}; }
  if (view === 'history') render();
}
function pct(x) { return x == null || !isFinite(x) ? '—' : (x * 100).toFixed(0) + '%'; }
let hFilter = 'ALL', hShow = 40;
const money = x => (x >= 0 ? '+$' : '-$') + Math.abs(x).toFixed(2);
const dayKey = ts => new Date(ts).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
function tradeUSD(h) { return h.outcome.r == null ? null : h.outcome.r * (h.plan.risk$ || S.account * S.risk / 100); }
function renderHistory(v) {
  if (!hist) { v.innerHTML = '<div class="skel"></div><div class="skel"></div>'; loadHistory(); return; }
  const all = [...hist].sort((a, b) => b.at - a.at);
  const closed = all.filter(h => h.outcome.result !== 'OPEN');
  const W = closed.filter(h => h.outcome.result === 'WIN').length, Lc = closed.filter(h => h.outcome.result === 'LOSS').length, T = closed.filter(h => h.outcome.result === 'TIME').length, O = all.length - closed.length;
  const netR = closed.reduce((s, h) => s + h.outcome.r, 0), netUSD = closed.reduce((s, h) => s + tradeUSD(h), 0);
  const tag = o => o.result === 'WIN' ? '<span class="tag LONG">WIN</span>' : o.result === 'LOSS' ? '<span class="tag SHORT">LOSS</span>' : o.result === 'TIME' ? '<span class="tag WATCH">TIMED OUT</span>' : '<span class="tag QUIET">OPEN</span>';
  // daily breakdown
  const days = {};
  for (const h of all) { const k = dayKey(h.at); const d = days[k] ||= { n: 0, w: 0, l: 0, t: 0, o: 0, usd: 0, at: h.at }; d.n++; const r = h.outcome.result; if (r === 'WIN') d.w++; else if (r === 'LOSS') d.l++; else if (r === 'TIME') d.t++; else d.o++; if (r !== 'OPEN') d.usd += tradeUSD(h); }
  const dayRows = Object.entries(days).sort((a, b) => b[1].at - a[1].at).map(([k, d]) => `<div><span>${k} · ${d.n} alerts · ${d.w}W ${d.l}L ${d.t}T${d.o ? ' ' + d.o + ' open' : ''}</span><span class="mono" style="color:${d.usd >= 0 ? 'var(--long)' : 'var(--short)'}">${money(d.usd)}</span></div>`).join('');
  const list = all.filter(h => hFilter === 'ALL' || h.outcome.result === hFilter);
  const chip = (f, l, n) => `<button data-hf="${f}" class="${hFilter === f ? 'on' : ''}">${l} ${n}</button>`;
  v.innerHTML = `<section class="panel"><h2>All alerts — results</h2>
    <div class="plan"><div><span>Win rate</span><b class="mono">${pct(W / closed.length)}</b></div><div><span>Net (R)</span><b class="mono" style="color:${netR >= 0 ? 'var(--long)' : 'var(--short)'}">${(netR >= 0 ? '+' : '') + netR.toFixed(1)}R</b></div><div><span>Net ($)</span><b class="mono" style="color:${netUSD >= 0 ? 'var(--long)' : 'var(--short)'}">${money(netUSD)}</b></div></div>
    <p class="note">${all.length} alerts since ${all.length ? dayKey(all.at(-1).at) : '—'} · ${W} wins · ${Lc} losses · ${T} timed out · ${O} open. Dollars use the risk each alert was sent with. Break-even win rate at 2.5:1 ≈ 29% (timed-out trades also count).</p></section>
    <section class="panel news"><h2>By day</h2>${dayRows || '<p class="note">No alerts yet.</p>'}</section>
    <section class="panel"><h2>Export for review</h2>
      <div class="row" style="gap:8px"><a class="btn ghost" style="text-align:center;text-decoration:none" href="${HRAW}/history.csv" target="_blank" rel="noopener">CSV</a><a class="btn ghost" style="text-align:center;text-decoration:none" href="${HRAW}/history.json" target="_blank" rel="noopener">JSON</a></div>
      <button class="btn" id="cpl">Copy report link</button><button class="btn ghost" id="cpt">Copy full report text</button><p class="note" id="cpmsg"></p></section>
    <div class="tabs" id="hf" style="flex-wrap:wrap">${chip('ALL', 'All', all.length)}${chip('WIN', 'Wins', W)}${chip('LOSS', 'Losses', Lc)}${chip('TIME', 'Timed out', T)}${chip('OPEN', 'Open', O)}</div>
    ${list.slice(0, hShow).map(h => { const usd = tradeUSD(h); return `<article class="card" onclick="this.classList.toggle('open')"><div class="row"><div><div class="sym">${h.id} <span class="tag ${h.dir}">${h.dir}</span></div><div class="nm">${new Date(h.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })} · score ${h.score}</div></div><div class="score">${tag(h.outcome)}<div class="mono" style="color:${usd == null ? 'var(--mute)' : usd >= 0 ? 'var(--long)' : 'var(--short)'}">${usd == null ? 'in progress' : (h.outcome.r > 0 ? '+' : '') + h.outcome.r + 'R · ' + money(usd)}</div></div></div>
      <div class="detail"><div class="plan"><div><span>Entry</span><b class="mono">${fmt(h.plan.entry)}</b></div><div class="sl"><span>Stop</span><b class="mono">${fmt(h.plan.stop)}</b></div><div class="tp"><span>Target</span><b class="mono">${fmt(h.plan.takeProfit)}</b></div></div>
      <p class="note">Exit ${fmt(h.outcome.exit)}${h.outcome.closedAt ? ' at ' + new Date(h.outcome.closedAt).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : ''} · size ${fmt(h.plan.qty)} ${h.plan.unit} · risk $${(h.plan.risk$ || 0).toFixed(2)} · best ${h.outcome.mfe?.toFixed(2) ?? '—'}R · worst ${h.outcome.mae?.toFixed(2) ?? '—'}R</p><ul class="f">${h.factors.map(f => `<li>${f}</li>`).join('')}</ul></div></article>`; }).join('') || '<div class="empty"><b>No alerts in this filter</b></div>'}
    ${list.length > hShow ? `<button class="btn ghost" id="more">Show ${Math.min(40, list.length - hShow)} more (${list.length - hShow} left)</button>` : ''}`;
  const msg = t => { $('#cpmsg').textContent = t; };
  const copy = async txt => { try { await navigator.clipboard.writeText(txt); msg('Copied.'); } catch { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); msg('Copied.'); } catch { msg(txt.slice(0, 200)); } ta.remove(); } };
  $('#cpl').onclick = () => copy(HRAW + '/history.csv');
  $('#cpt').onclick = async () => { const [a, b] = await Promise.all([fetch(HRAW + '/summary.json?t=' + Date.now()).then(r => r.text()), fetch(HRAW + '/history.csv?t=' + Date.now()).then(r => r.text())]); copy(`SURGE RADAR PERFORMANCE REPORT\nGenerated ${new Date().toISOString()}\n\n== SUMMARY ==\n${a}\n\n== ALERT LOG (CSV) ==\n${b}`); };
  $('#hf').onclick = e => { const f = e.target.closest('button')?.dataset.hf; if (f) { hFilter = f; hShow = 40; render(); } };
  const m = $('#more'); if (m) m.onclick = () => { hShow += 40; render(); };
}
function notifyNew() {
  if (!S.notify || Notification.permission !== 'granted') return;
  const seen = seenMem, now = Date.now();
  for (const r of scan.results.filter(r => r.status === 'ALERT')) {
    const k = r.id + r.dir; if (seen[k] && now - seen[k] < 4 * 3600e3) continue; seen[k] = now;
    const p = adjust(r);
    navigator.serviceWorker?.ready.then(reg => reg.showNotification(`${r.id} ${r.dir} · score ${r.score}`, { body: `Entry ${fmt(p.entry)} · Stop ${fmt(p.stop)} · TP ${fmt(p.takeProfit)}`, icon: 'icon-192.png', tag: k }));
  }
}
async function load(force) {
  try {
    const r = await fetch(API + (force ? '?force=1' : ''), { cache: 'no-store' });
    scan = await r.json();
    $('#last').textContent = 'Scanned ' + t(scan.at); notifyNew(); loadHistory();
  } catch {  $('#last').textContent = scan ? 'Offline · ' + t(scan.at) : 'Offline'; }
  nextAt = Date.now() + 10 * 60e3; render();
}
setInterval(() => { const s = Math.max(0, Math.round((nextAt - Date.now()) / 1000)); $('#next').textContent = `next scan ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s === 0) load(true); }, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() > nextAt - 9 * 60e3) load(true); });
$('#tabs').onclick = e => { if (e.target.dataset.f) { filter = e.target.dataset.f; document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b === e.target)); render(); } };
document.querySelector('nav').onclick = e => { if (e.target.dataset.v) { view = e.target.dataset.v; render(); } };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
render(); load(true);
</script>
</body>
</html>
